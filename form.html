<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Pendaftaran</title>

  <style>
    body{
      font-family: Times New Roman, serif;
      background-color: #f5f5f5;
    }

    h1{
      text-align: center;
      margin-top: 30px;
      font-size: 45px;
    }

    .container{
      width: 400px;
      margin-left: 20px;
      margin-top: 40px;
    }

    table{
      border-spacing: 5px;
    }

    input, textarea, select{
      padding: 5px;
    }

    textarea{
      width: 200px;
      height: 80px;
    }

    .btn{
      margin-top: 10px;
      padding: 8px 15px;
      background-color: blue;
      color: white;
      border: none;
      cursor: pointer;
    }

    .btn:hover{
      background-color: darkblue;
    }
  </style>
</head>

<body>

  <h1>Formulir Pendaftaran</h1>

  <div class="container">
    <form action="">

      <table>
        <tr>
          <td>NISN</td>
          <td>:</td>
          <td>
            <input type="text" placeholder="Masukan NISN">
          </td>
        </tr>

        <tr>
          <td>Nama</td>
          <td>:</td>
          <td>
            <input type="text" placeholder="Masukan Nama Lengkap">
          </td>
        </tr>

        <tr>
          <td>Email</td>
          <td>:</td>
          <td>
            <input type="email" placeholder="Masukan Email">
          </td>
        </tr>

        <tr>
          <td>Password</td>
          <td>:</td>
          <td>
            <input type="password" placeholder="Masukan Password">
          </td>
        </tr>

        <tr>
          <td>Telepone</td>
          <td>:</td>
          <td>
            <input type="text" placeholder="Masukan nomor telepone">
          </td>
        </tr>

        <tr>
          <td>Alamat</td>
          <td>:</td>
          <td>
            <textarea placeholder="Masukan Alamat"></textarea>
          </td>
        </tr>

        <tr>
          <td>Upload Foto</td>
          <td>:</td>
          <td>
            <input type="file">
          </td>
        </tr>

        <tr>
          <td>Jenis Kelamin</td>
          <td>:</td>
          <td>
            <input type="radio" name="jk"> Laki-laki
            <input type="radio" name="jk"> Perempuan
          </td>
        </tr>

        <tr>
          <td>Pilih Jurusan</td>
          <td>:</td>
          <td>
            <select>
              <option>Pilih Jurusan</option>
              <option>RPL</option>
              <option>TKJ</option>
              <option>Multimedia</option>
            </select>
          </td>
        </tr>

        <tr>
          <td colspan="3">
            <button type="submit" class="btn">Daftar</button>
          </td>
        </tr>

      </table>

    </form>
  </div>

</body>
</html>
