<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>belajar CSS (cascading style sheet)</title>
   <link rel="styleheet" href="style.css">
    <style>
        h2{
            color: yellow;
            background-color: skyblue;
        }
    </style>
</head>
<body>
    <!-- contoh menggunakan inline style -->
    
    <h1 style="color:red;font-family: 'Times new roman';">Belajar CSS Menggunakan inline style</h1>
    
    <!-- contoh menggunakan internal style -->
     <h2>Belajar menggunakan internal style</h2> 

     <!-- contoh menggunakan internal style -->
      <h4>belajar menggunakan eksternal style</h4>
</body>
</html>
